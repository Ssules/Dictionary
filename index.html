<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dictionary</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff}
body{font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
form{display:flex;gap:10px;border-bottom:1px solid #444;padding-bottom:10px}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:22px}
input::placeholder{color:#666}
button{background:none;border:0;color:#aaa;font:inherit;font-size:18px}
main{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding-bottom:12vh}
.card{max-width:100%;text-align:right}
h1{font-weight:400;font-size:clamp(40px,12vw,72px);margin:0;line-height:1.1;word-break:break-word}
.ph{font-size:20px;margin:6px 0 14px}
.ph i{font-style:italic}
hr{border:0;border-top:1px solid #777;margin:0 0 14px}
.ar{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Traditional Arabic",Tahoma,serif}
.arw{font-size:clamp(32px,9vw,52px);line-height:1.4}
.def{font-size:clamp(20px,5.5vw,30px);line-height:1.5;margin-top:10px;color:#ccc}
.def.en{color:#fff;margin-top:14px}
.def.ar{font-size:clamp(20px,5.5vw,28px)}
.msg{color:#777;font-size:18px}
</style>
</head>
<body>
<form id="f"><input id="q" placeholder="English or Arabic word" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"><button type="submit">Go</button></form>
<main><div class="card" id="out"><div class="msg">Search a word.</div></div></main>
<script>
var out=document.getElementById('out'),q=document.getElementById('q');
var POS={noun:'n.',verb:'v.',adjective:'adj.',adverb:'adv.',pronoun:'pron.',preposition:'prep.',conjunction:'conj.',interjection:'exclam.',article:'art.',determiner:'det.'};
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function syl(w){
  w=w.toLowerCase();
  if(!/^[a-z]+$/.test(w))return w;
  var tail='';
  if(/[^aeiouy]e$/.test(w)&&!/[^aeiouy]le$/.test(w)){tail='e';w=w.slice(0,-1);}
  var parts=w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/g)||[w];
  parts[parts.length-1]+=tail;
  return parts.join('·');
}
function getJSON(url,ms){
  return new Promise(function(resolve,reject){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'));}},ms);
    fetch(url).then(function(r){
      if(done)return;
      if(r.status===404){done=true;clearTimeout(t);reject(new Error('notfound'));return;}
      if(!r.ok){done=true;clearTimeout(t);reject(new Error('http '+r.status));return;}
      return r.json().then(function(j){if(!done){done=true;clearTimeout(t);resolve(j);}});
    }).catch(function(e){if(!done){done=true;clearTimeout(t);reject(e);}});
  });
}
function strip(h){var d=document.createElement('div');d.innerHTML=h;return (d.textContent||'').trim();}
async function enEntry(w){
  try{
    var data=await getJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),9000);
    var e0=data[0],ph=e0.phonetic||'';
    if(!ph){for(var i=0;i<(e0.phonetics||[]).length;i++){if(e0.phonetics[i].text){ph=e0.phonetics[i].text;break;}}}
    var m=e0.meanings&&e0.meanings[0];
    return {word:e0.word,ph:ph.replace(/^\/|\/$/g,''),pos:m?(POS[m.partOfSpeech]||m.partOfSpeech):'',def:m&&m.definitions[0]?m.definitions[0].definition:''};
  }catch(e){}
  try{
    var j=await getJSON('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(w),9000);
    var en=j.en&&j.en[0];
    if(en){var k=en.partOfSpeech.toLowerCase();return {word:w,ph:'',pos:POS[k]||k,def:strip(en.definitions[0].definition)};}
  }catch(e){}
  return null;
}
async function toAr(text){
  var j=await getJSON('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|ar',8000);
  var main=j.responseData&&j.responseData.translatedText;
  if(!main||/MYMEMORY WARNING|INVALID/i.test(main))throw new Error('translate');
  var isAr=function(t){return /[\u0600-\u06FF]/.test(t)&&!/[A-Za-z]/.test(t);};
  var alts=isAr(main)?[main]:[];
  (j.matches||[]).forEach(function(m){
    var t=(m.translation||'').trim();
    if(t&&isAr(t)&&alts.indexOf(t)<0&&alts.length<3&&t.length<40)alts.push(t);
  });
  if(!alts.length)alts=[main];
  return {main:alts[0],alts:alts};
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var w=q.value.trim().toLowerCase();if(!w)return;
  q.blur();
  out.innerHTML='<div class="msg">Searching…</div>';
  try{
    if(/[\u0600-\u06FF]/.test(w)){
      var j=await getJSON('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=ar|en',8000);
      var t=(j.responseData&&j.responseData.translatedText||'').trim().toLowerCase();
      if(!t||/MYMEMORY WARNING|INVALID/i.test(t))throw new Error('translate');
      w=t;
    }
    var res=await Promise.all([enEntry(w),toAr(w)]);
    var en=res[0],ar=res[1];
    var arDef='';
    if(en&&en.def){try{arDef=(await toAr(en.def)).main;}catch(e){}}
    var word=en?en.word:w;
    out.innerHTML='<h1>'+esc(cap(syl(word)))+'</h1>'
      +'<div class="ph">'+(en&&en.ph?'/'+esc(en.ph)+'/ ':'')+'<i>'+esc(en?en.pos:'')+'</i></div><hr>'
      +'<div class="ar arw">'+esc(ar.alts.join(' · '))+'</div>'
      +(en&&en.def?'<div class="def en">'+esc(en.def)+'</div>':'')
      +(arDef?'<div class="ar def">'+esc(arDef)+'</div>':'');
  }catch(err){
    out.innerHTML='<div class="msg">Could not load ('+esc(err.message)+'). Check internet or Shields.</div>';
  }
});
</script>
</body>
</html>
